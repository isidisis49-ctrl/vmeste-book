name: Validate and publish illustrated books
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: vmeste-book-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public document dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-pdf.txt
      - name: Confirm embedded fonts are available
        run: test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Verify published file checksums
        working-directory: downloads
        run: sha256sum -c SHA256SUMS
      - name: Validate all committed editions
        run: python tools/validate_pdfs.py --output "$RUNNER_TEMP/published-validation.json"
      - name: Independently rebuild from public sources
        run: python tools/build_pdfs.py --output-dir "$RUNNER_TEMP/rebuilt-books"
      - name: Validate rebuilt editions and compare all text
        run: python tools/validate_pdfs.py --pdf-dir "$RUNNER_TEMP/rebuilt-books" --compare-dir downloads --output "$RUNNER_TEMP/rebuilt-validation.json"
      - name: Write verification summary
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          published=json.loads((Path(os.environ['RUNNER_TEMP'])/'published-validation.json').read_text())
          rebuilt=json.loads((Path(os.environ['RUNNER_TEMP'])/'rebuilt-validation.json').read_text())
          print('PUBLISHED',published['summary'])
          print('REBUILT',rebuilt['summary'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Four published editions: '+str(published['summary'])+'\n\nIndependent rebuild: '+str(rebuilt['summary'])+'\n')
          PY
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the validated four-language release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EDITION_TAG: v2026.11.15-illustrated
        run: |
          if gh release view "$EDITION_TAG" >/dev/null 2>&1; then
            echo 'Edition already published; existing assets preserved.'
            exit 0
          fi
          gh release create "$EDITION_TAG" downloads/VMESTE_Book_RU_2026.pdf downloads/VMESTE_Book_EN_2026.pdf downloads/VMESTE_Book_DE_2026.pdf downloads/VMESTE_Book_FR_2026.pdf downloads/SHA256SUMS downloads/editions-manifest.json --target "$GITHUB_SHA" --title "VMESTE · Illustrated books · RU / EN / DE / FR" --notes-file docs/RELEASE_NOTES.md
