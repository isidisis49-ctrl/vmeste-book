name: Build multilingual book PDFs
on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'assets/**'
      - 'tools/build_pdfs.py'
      - '.github/workflows/build-books.yml'
  workflow_dispatch:
concurrency:
  group: vmeste-book-pdf-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public book files
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab cairosvg
      - name: Build all four PDF editions
        run: python tools/build_pdfs.py
      - name: Confirm PDF outputs
        run: |
          test -s downloads/VMESTE_Book_RU_2026.pdf
          test -s downloads/VMESTE_Book_EN_2026.pdf
          test -s downloads/VMESTE_Book_DE_2026.pdf
          test -s downloads/VMESTE_Book_FR_2026.pdf
      - name: Commit generated public book files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/VMESTE_Book_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish PDF editions: RU EN DE FR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
